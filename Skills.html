<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #d29a58;
    --wood-dark: #c48848;
    --ink: #11141d;
    --ball: #ff6a13;
    --line: #fff7e8;
    --text: #f4efe6;
    --muted: #b9c2d0;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    padding-bottom: 32px;
    font-family: "Roboto", system-ui, sans-serif;
    color: var(--text);
    /* hardwood planks */
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0) 0 46px,
        rgba(90,50,15,.28) 46px 48px),
      repeating-linear-gradient(90deg,
        var(--wood) 0 48px,
        var(--wood-dark) 48px 96px);
  }

  /* court markings, fixed behind everything */
  .court {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  /* ---- header ---- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px;
    background: var(--ink);
    border-bottom: 4px solid var(--ball);
  }

  .top h1 {
    font-family: "Anton", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 9vw, 3rem);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .logout {
    padding: 10px 16px;
    background: var(--ball);
    color: var(--ink);
    border: 0;
    border-radius: 999px;
    font: 700 0.9rem "Roboto", sans-serif;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .logout:active { transform: translateY(1px); }

  /* ---- content ---- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  .intro {
    margin-bottom: 18px;
    padding: 18px 20px;
    background: var(--ink);
    border-radius: 16px;
  }

  .intro h2 {
    font-family: "Anton", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 8vw, 2.6rem);
    line-height: 1.1;
    color: var(--ball);
  }

  .intro p { margin-top: 6px; color: var(--muted); }

  .cards { display: grid; gap: 14px; list-style: none; padding: 0; }

  .card {
    padding: 22px 20px 22px 22px;
    background: var(--ink);
    border-left: 8px solid var(--ball);
    border-radius: 6px 20px 20px 6px;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
  }

  .card h3 {
    font-family: "Anton", Impact, sans-serif;
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
  }

  .card p { margin-top: 8px; color: var(--muted); }
</style>
</head>
<body>

<!-- Half-court: hoop and key at the top -->
<svg class="court" viewBox="0 0 500 940" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <g fill="none" stroke="#fff7e8" stroke-width="5" stroke-linecap="round" opacity=".9">
    <rect x="170" y="20" width="160" height="190" fill="#1f3a5f" fill-opacity=".55"/>
    <path d="M190 210a60 60 0 0 1 120 0"/>
    <path d="M190 210a60 60 0 0 0 120 0" stroke-dasharray="4 14"/>
    <path d="M40 20v70A215 215 0 0 0 460 90V20"/>
    <path d="M220 44h60"/>
    <circle cx="250" cy="66" r="14" stroke="#ff6a13" stroke-width="5"/>
    <path d="M250 44v8"/>
    <circle cx="250" cy="880" r="70"/>
    <path d="M0 880h180M320 880h180"/>
  </g>
</svg>

<header class="top">
  <h1>MY .NATURE</h1>
  <button class="logout" type="button">LOGOUT</button>
</header>

<main>
  <section class="intro">
    <h2>SKILLS 🌿 Green</h2>
    <p>Nature inspired skills!</p>
  </section>

  <ul class="cards">
    <li class="card">
      <h3>🌿 Nature Photography</h3>
      <p>Mountain, beach, forest shots</p>
    </li>
    <li class="card">
      <h3>🏔️ Hiking &amp; Trekking</h3>
      <p>Trail guide, adventure seeker</p>
    </li>
    <li class="card">
      <h3>💻 Eco Coding</h3>
      <p>Green code, sustainable dev</p>
    </li>
  </ul>
</main>

</body>
</html>
