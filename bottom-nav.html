<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bottom nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --pill: #0e111b;
    --accent: #ff6a13;
    --idle: #7b7e86;
    --idle-hover: #a9acb4;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Page content placeholder */
  main {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px 24px 140px;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--idle);
  }

  /* ---- Nav bar ---- */
  .nav {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 12px 16px;
    background: var(--pill);
    border: 2px solid var(--accent);
    border-radius: 36px;
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 4px 2px;
    background: none;
    border: 0;
    border-radius: 14px;
    color: var(--idle);
    font: inherit;
    font-size: clamp(11px, 3.2vw, 14px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }

  .tab svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab .solid { fill: currentColor; stroke: none; }

  .tab:hover { color: var(--idle-hover); }
  .tab[aria-current="page"] { color: var(--accent); }

  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<main id="view">Home</main>

<nav class="nav" aria-label="Main">
  <button class="tab" data-page="Home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
    Home
  </button>

  <button class="tab" data-page="Photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M12 4v16"/></svg>
    Photo
  </button>

  <button class="tab" data-page="Skills">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M12 2c.8 5.4 4.6 9.2 10 10-5.4.8-9.2 4.6-10 10-.8-5.4-4.6-9.2-10-10 5.4-.8 9.2-4.6 10-10z"/></svg>
    Skills
  </button>

  <button class="tab" data-page="Goals">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle class="solid" cx="12" cy="12" r="3"/></svg>
    Goals
  </button>

  <button class="tab" data-page="Fun">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.8 2.4 2.6 4 2.6s3-.8 4-2.6"/><circle class="solid" cx="9" cy="9.5" r="1.3"/><circle class="solid" cx="15" cy="9.5" r="1.3"/></svg>
    Fun
  </button>

  <button class="tab" data-page="Contact">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/></svg>
    Contact
  </button>
</nav>

<script>
  const tabs = document.querySelectorAll(".tab");
  const view = document.getElementById("view");

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.removeAttribute("aria-current"));
      tab.setAttribute("aria-current", "page");
      view.textContent = tab.dataset.page;
    });
  });
</script>
</body>
</html>
