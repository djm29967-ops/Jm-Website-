<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - My Basketball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{min-height:100vh;background:#080c14;color:white;padding-bottom:100px;}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:#0c111c;border-bottom:1.5px solid #ff6a00;}
.logo{font-weight:900;font-size:20px;}
.logo span{color:#ff6a00;text-shadow:0 0 10px #ff6a00;}
.logout{border:1.5px solid #ff6a00;color:#ff6a00;background:transparent;padding:8px 22px;border-radius:25px;font-weight:bold;cursor:pointer;}
.container{margin:20px 15px;background:#121a2b;border:1.5px solid rgba(255,106,0,0.4);border-radius:28px;padding:30px 20px;}
.title{text-align:center;font-size:32px;font-weight:900;color:#ff8c32;text-shadow:0 0 12px #ff6a00;}
.subtitle{text-align:center;font-size:14px;color:#ff9a4d;margin:5px 0 30px 0;}
input,textarea{width:100%;background:#080c14;border:1.5px solid rgba(255,106,0,0.3);border-radius:25px;padding:18px 20px;color:white;outline:none;font-size:15px;margin-bottom:20px;}
textarea{height:130px;border-radius:20px;resize:none;}
input:focus,textarea:focus{border-color:#ff6a00;box-shadow:0 0 12px rgba(255,106,0,0.4);}
.send-btn{width:100%;height:55px;background:#ff6a00;border:none;border-radius:25px;color:black;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 0 20px #ff6a00;}
.bottom-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:#0c111c;border:1.5px solid #ff6a00;border-radius:30px;display:flex;justify-content:space-around;padding:12px 5px;}
.nav-item{text-align:center;font-size:10px;color:#777;font-weight:bold;}
.nav-item.active{color:#ff6a00;}
.nav-item span{font-size:20px;display:block;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">MY <span>.BASKETBALL</span></div>
  <button class="logout">LOGOUT</button>
</div>

<div class="container">
  <h1 class="title">CONTACT 🏀</h1>
  <p class="subtitle">Connect with basketball lover!</p>
  <input type="text" placeholder="Your Name" id="name">
  <input type="email" placeholder="Email" id="email">
  <textarea placeholder="Message..." id="msg"></textarea>
  <button class="send-btn" onclick="sendMsg()">Send 🏀</button>
</div>

<div class="bottom-nav">
  <div class="nav-item"><span>⌂</span>HOME</div>
  <div class="nav-item"><span>🖼</span>PHOTO</div>
  <div class="nav-item"><span>✦</span>SKILLS</div>
  <div class="nav-item"><span>◎</span>GOALS</div>
  <div class="nav-item"><span>☺</span>FUN</div>
  <div class="nav-item active"><span>◍</span>CONTACT</div>
</div>

<script>
function sendMsg(){
  let n=document.getElementById('name').value;
  if(n==""){alert("Enter your name!");return;}
  alert("Message sent! Thanks "+n+" 🏀");
}
</script>

</body>
</html>
